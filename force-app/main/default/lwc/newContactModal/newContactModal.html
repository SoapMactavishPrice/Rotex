<template>
    <template if:true={portalToastVisible}>
        <div class={portalToastClass} role="status" aria-live="polite">
            <div class="portal-toast__title">{portalToastTitle}</div>
            <template if:true={portalToastMessage}>
                <div class="portal-toast__message">{portalToastMessage}</div>
            </template>
        </div>
    </template>
    <div class="modal-container" onclick={stopPropagation}>

        <div class="modal-header">
            <div class="modal-title">{modalTitle}</div>
            <button
                type="button"
                class="modal-close-btn"
                onclick={handleClose}
                disabled={isSaving}>
                ✕
            </button>
        </div>

        <div class="modal-body">

            <div class="section-label">CONTACT DETAILS</div>

            <div class="form-grid">
                <div class="form-field">
                    <label class="form-label">Salutation</label>
                    <select class="form-input" value={salutation} onchange={handleSalutationChange}>
                        <option value="">--None--</option>
                        <template for:each={salutationOptions} for:item="opt">
                            <option key={opt} value={opt}>{opt}</option>
                        </template>
                    </select>
                </div>

                <div class="form-field">
                    <label class="form-label form-required">Customer Name</label>
                    <template if:false={hasSelectedAccount}>
                        <div class="lookup-wrap">
                            <input
                                type="text"
                                class={accountInputClass}
                                placeholder="Search your Customer accounts..."
                                value={accountSearch}
                                onfocus={handleAccountFocus}
                                oninput={handleAccountSearch}
                                autocomplete="off"/>
                            <template if:true={showAccountDropdown}>
                                <div class="lookup-results">
                                    <template if:true={hasAccountResults}>
                                        <template for:each={accountResults} for:item="row">
                                            <div
                                                key={row.id}
                                                class="lookup-item"
                                                data-id={row.id}
                                                data-label={row.label}
                                                onmousedown={selectAccount}>
                                                <div class="lookup-item-label">{row.label}</div>
                                                <template if:true={row.subtitle}>
                                                    <div class="lookup-item-sub">{row.subtitle}</div>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={hasAccountResults}>
                                        <div class="lookup-empty">No matching customers</div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:true={hasSelectedAccount}>
                        <div class="lookup-chip">
                            <span>{accountName}</span>
                            <button type="button" class="chip-clear" onclick={clearAccount}>✕</button>
                        </div>
                    </template>
                    <template if:true={errors.accountId}>
                        <div class="form-error">{errors.accountId}</div>
                    </template>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label class="form-label form-required">First Name</label>
                    <input
                        type="text"
                        class={firstNameInputClass}
                        value={firstName}
                        oninput={handleFirstNameChange}/>
                    <template if:true={errors.firstName}>
                        <div class="form-error">{errors.firstName}</div>
                    </template>
                </div>

                <div class="form-field">
                    <label class="form-label">DOB</label>
                    <input
                        type="date"
                        class="form-input"
                        value={dob}
                        oninput={handleDobChange}/>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label class="form-label form-required">Last Name</label>
                    <input
                        type="text"
                        class={lastNameInputClass}
                        value={lastName}
                        oninput={handleLastNameChange}/>
                    <template if:true={errors.lastName}>
                        <div class="form-error">{errors.lastName}</div>
                    </template>
                </div>

                <div class="form-field">
                    <label class="form-label">Anniversary</label>
                    <input
                        type="date"
                        class="form-input"
                        value={anniversary}
                        oninput={handleAnniversaryChange}/>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label class="form-label">Email Id</label>
                    <input
                        type="email"
                        class="form-input"
                        value={email}
                        oninput={handleEmailChange}/>
                </div>

                <div class="form-field">
                    <label class="form-label">Mobile No</label>
                    <input
                        type="tel"
                        class="form-input"
                        value={mobilePhone}
                        oninput={handleMobileChange}/>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label class="form-label">Designation</label>
                    <input
                        type="text"
                        class="form-input"
                        value={designation}
                        oninput={handleDesignationChange}
                        placeholder="e.g. Manager"/>
                </div>

                <div class="form-field">
                    <label class="form-label">Status</label>
                    <select class="form-input" value={status} onchange={handleStatusChange}>
                        <template for:each={statusOptions} for:item="opt">
                            <option key={opt} value={opt}>{opt}</option>
                        </template>
                    </select>
                </div>
            </div>

            <div class="section-divider"></div>
            <div class="section-label">ADDRESS INFORMATION</div>

            <div class="form-field form-field-full">
                <label class="form-label">Street</label>
                <input
                    type="text"
                    class="form-input"
                    value={street}
                    oninput={handleStreetChange}/>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label class="form-label">City</label>
                    <input
                        type="text"
                        class="form-input"
                        value={city}
                        oninput={handleCityChange}/>
                </div>
                <div class="form-field">
                    <label class="form-label">State</label>
                    <input
                        type="text"
                        class="form-input"
                        value={state}
                        oninput={handleStateChange}/>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-field">
                    <label class="form-label">Postal Code</label>
                    <input
                        type="text"
                        class="form-input"
                        value={postalCode}
                        oninput={handlePostalCodeChange}/>
                </div>
                <div class="form-field">
                    <label class="form-label">Country</label>
                    <input
                        type="text"
                        class="form-input"
                        value={country}
                        oninput={handleCountryChange}/>
                </div>
            </div>

        </div>

        <div class="modal-footer">
            <button
                type="button"
                class="btn-cancel"
                onclick={handleClose}
                disabled={isSaving}>
                Cancel
            </button>
            <button
                type="button"
                class="btn-save"
                onclick={handleSave}
                disabled={isSaving}>
                <template if:false={isSaving}>{saveButtonLabel}</template>
                <template if:true={isSaving}>Saving…</template>
            </button>
        </div>

    </div>
</template>
