<template>
    <div class="sidebar">

        <!-- LOGO -->
        <div class="logo-section">
            <img src={logoUrl} class="logo"/>
        </div>

        <!-- MENU -->
        <template if:true={isNavReady}>
            <ul class="menu-list">

                <template
                    for:each={processedMenuItems}
                    for:item="item">

                    <li key={item.id}>

                        <c-main-navigation
                            item={item}
                            active-item-id={activeItemId}
                            onitemselected={handleItemSelected}>
                        </c-main-navigation>

                    </li>

                </template>

            </ul>
        </template>

    </div>
</template>
