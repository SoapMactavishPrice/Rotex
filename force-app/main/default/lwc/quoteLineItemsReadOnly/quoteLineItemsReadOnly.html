<template>
    <lightning-card>
        <!-- ── Card Header ── -->
        <div class="header-container">
            <h4 class="header-title">
                <template if:true={isARCRecordType}>
                    ARC Quote Line Items
                </template>
                <template if:false={isARCRecordType}>
                    Quote Line Items
                </template>
                <span class="quote-number-badge">{quoteNumber}</span>
            </h4>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasError}>
                <div class="error-container">
                    <lightning-icon icon-name="utility:error" size="medium" alternative-text="Error"></lightning-icon>
                    <p>{errorMessage}</p>
                </div>
            </template>

            <template if:false={hasError}>
                <!-- ── Quote Header ── -->
                <div class="quote-header">
                    <div class="quote-header-grid">
                        <div class="header-field">
                            <span class="field-label">Quote No.</span>
                            <span class="field-value">{quoteNumber}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Customer Name</span>
                            <span class="field-value">{accountName}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Quote Owner</span>
                            <span class="field-value">{quoteOwnerName}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Valid Till</span>
                            <span class="field-value">{quoteValidTill}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Total Value</span>
                            <span class="field-value">{totalValueFormatted}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Avg. Discount Requested</span>
                            <span class="field-value">{avgDiscountRequested}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Avg. Discount Approved</span>
                            <span class="field-value">{avgDiscountApproved}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Rev No.</span>
                            <span class="field-value">{revNo}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Validity of Offer</span>
                            <span class="field-value">{validityOfOffer}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Payment Terms</span>
                            <span class="field-value">{paymentTerms}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Warranty Terms</span>
                            <span class="field-value">{warrantyTerms}</span>
                        </div>
                        <div class="header-field">
                            <span class="field-label">Delivery Period</span>
                            <span class="field-value">{deliveryPeriod}</span>
                        </div>
                    </div>
                </div>

                <!-- ── Line Items Table ── -->
                <template if:true={hasLineItems}>
                    <div class="table-container">
                        <table style="width:100%; table-layout:auto; border-collapse:collapse; border:1px solid #000; font-size:12px; color:#3e3e3c;">
                            <thead>
                                <tr style="background-color:#007764;">
                                    <th scope="col" style="width:8.5%; border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:left; white-space:normal; word-break:break-word;">Product Name</th>
                                    <th scope="col" style="width:4.5%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">List Price</th>
                                    <template if:true={isARCRecordType}>
                                        <th scope="col" style="width:4%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">MOQ</th>
                                    </template>
                                    <template if:false={isARCRecordType}>
                                        <th scope="col" style="width:3%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">Qty</th>
                                    </template>
                                    <th scope="col" style="width:3%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">Disc. SAP%</th>
                                    <th scope="col" style="width:3%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">Pr. Disc.%</th>
                                    <th scope="col" style="width:5%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">Disc.%</th>
                                    <th scope="col" style="width:5%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">Sales Price</th>
                                    <template if:true={isARCRecordType}>
                                        <th scope="col" style="width:4.5%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">Valid From</th>
                                        <th scope="col" style="width:4.5%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:center;">Valid Till</th>
                                    </template>
                                    <th scope="col" style="width:10.5%; border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:left;">SOA User</th>
                                    <th scope="col" style="width:6.5%;  border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:left;">Status</th>
                                    <th scope="col" style="width:12%; border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:left;">Requestor Comments</th>
                                    <th scope="col" style="width:14%; border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:left;">Previous Approver Comments</th>
                                    <th scope="col" style="width:15%; border:1px solid #000; padding:8px 7px; font-size:11px; font-weight:700; color:#fff; text-transform:uppercase; text-align:left;">Approver Comments</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={displayRows} for:item="row">
                                    <tr key={row.key}>

                                        <!-- Product-level cells (merged rows) -->
                                        <template if:true={row.isFirstRow}>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; white-space:normal; word-break:break-word; overflow-wrap:break-word;">
                                                {row.productName}<br/>
                                                <strong>({row.productCode})</strong>
                                            </td>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.listPriceFormatted}</td>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.quantity}</td>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.d1}</td>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.previousDiscount}</td>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.d2}</td>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.salesPrice}</td>
                                            <template if:true={isARCRecordType}>
                                                <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.validFrom}</td>
                                                <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle; text-align:center;">{row.validTill}</td>
                                            </template>
                                        </template>

                                        <!-- SOA Label -->
                                        <td style="border:1px solid #000; padding:8px; vertical-align:top;">
                                            <span style="color:#444; font-weight:600; font-size:11.5px; white-space:pre-wrap; overflow-wrap:anywhere;">{row.soaDisplay}</span>
                                        </td>

                                        <!-- Status -->
                                        <td style="border:1px solid #000; padding:8px; vertical-align:top;">
                                            <span class={row.statusBadgeClass}>{row.soaStatus}</span>
                                            <template if:true={row.soaDateTime}>
                                                <div style="font-size:11px; color:#706e6b; white-space:nowrap; margin-top:4px;">{row.soaDateTime}</div>
                                            </template>
                                        </td>

                                        <!-- Requestor Comments -->
                                        <template if:true={row.isFirstRow}>
                                            <td rowspan={row.soaCount} style="border:1px solid #000; padding:8px; vertical-align:middle;">
                                                <span style="white-space:pre-wrap; overflow-wrap:anywhere; display:block; color:#3e3e3c; line-height:1.45;">{row.requestedComments}</span>
                                            </td>
                                        </template>

                                        <!-- Previous Comments -->
                                        <td style="border:1px solid #000; padding:8px; vertical-align:top;">
                                            <span style="white-space:pre-wrap; overflow-wrap:anywhere; display:block; color:#3e3e3c; line-height:1.45;">{row.prevSoaComments}</span>
                                        </td>

                                        <!-- Comments -->
                                        <td style="border:1px solid #000; padding:8px; vertical-align:top;">
                                            <span style="white-space:pre-wrap; overflow-wrap:anywhere; display:block; color:#3e3e3c; line-height:1.45;">{row.soaComments}</span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <template if:false={hasLineItems}>
                    <div class="empty-state">
                        <p>No line items found for this quote.</p>
                    </div>
                </template>

                <!-- ── Footer Buttons ── -->
                <div class="slds-m-top_medium slds-text-align_center action-footer">
                    <lightning-button
                        label="Cancel"
                        onclick={handleCancel}
                        variant="neutral">
                    </lightning-button>
                </div>
            </template>
        </template>
    </lightning-card>
</template>
