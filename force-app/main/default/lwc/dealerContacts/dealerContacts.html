<template>
    <template if:true={portalToastVisible}>
        <div class={portalToastClass} role="status" aria-live="polite">
            <div class="portal-toast__title">{portalToastTitle}</div>
            <template if:true={portalToastMessage}>
                <div class="portal-toast__message">{portalToastMessage}</div>
            </template>
        </div>
    </template>
    <template if:false={selectedContact}>
        <div class="list-view">
            <c-dealer-user-menu></c-dealer-user-menu>
            <div class="page-header">
                <div>
                    <div class="breadcrumb">CONTACTS · ASSIGNED TO YOU</div>
                    <div class="page-title">Contacts</div>
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 20 20" fill="none">
                        <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M13 13l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                    </svg>
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search by name, customer, email, mobile..."
                        onkeyup={handleSearch}/>
                </div>

                <div class="filter-bar-right">
                    <div class="status-tabs">
                        <button
                            type="button"
                            class={allTabClass}
                            data-status="All"
                            onclick={handleStatusFilter}>
                            All <span>{totalCount}</span>
                        </button>
                        <button
                            type="button"
                            class={activeTabClass}
                            data-status="Active"
                            onclick={handleStatusFilter}>
                            Active <span>{activeCount}</span>
                        </button>
                        <button
                            type="button"
                            class={inactiveTabClass}
                            data-status="Inactive"
                            onclick={handleStatusFilter}>
                            Inactive <span>{inactiveCount}</span>
                        </button>
                    </div>

                    <div class="filter-actions">
                        <c-dealer-data-export
                            object-key="Contact"
                            button-label="Export"
                            status-filter={selectedStatus}
                            search-key={searchKey}
                        ></c-dealer-data-export>
                        <button type="button" class="btn-create" onclick={handleCreateContact}>
                            <svg viewBox="0 0 16 16" fill="none" class="btn-create-icon">
                                <path d="M8 3v10M3 8h10" stroke="currentColor"
                                    stroke-width="2.2" stroke-linecap="round"/>
                            </svg>
                            Create Contact
                        </button>
                    </div>
                </div>
            </div>

            <div class="contact-table">
                <div class="table-header">
                    <div>NAME</div>
                    <div>CUSTOMER</div>
                    <div>EMAIL</div>
                    <div>MOBILE</div>
                    <div>DESIGNATION</div>
                    <div>STATUS</div>
                    <div>LOCATION</div>
                    <div>CREATED</div>
                </div>

                <template if:true={hasContacts}>
                    <template for:each={filteredContacts} for:item="contact">
                        <div
                            key={contact.Id}
                            class="table-row"
                            data-id={contact.Id}
                            onclick={openContactDetail}>
                            <div>
                                <div class="customer-name">{contact.Name}</div>
                            </div>
                            <div class="contact-text">{contact.accountName}</div>
                            <div class="contact-text">{contact.Email}</div>
                            <div class="contact-text">{contact.MobilePhone}</div>
                            <div class="contact-text">{contact.designation}</div>
                            <div>
                                <span class={contact.statusBadgeClass}>{contact.statusDisplay}</span>
                            </div>
                            <div class="contact-text">{contact.locationLabel}</div>
                            <div class="contact-text">{contact.createdDate}</div>
                        </div>
                    </template>
                </template>

                <template if:false={hasContacts}>
                    <div class="empty-state">No contacts found for your Channel Partner customers.</div>
                </template>
            </div>
        </div>
    </template>

    <template if:true={selectedContact}>
        <div class="detail-view">
            <c-dealer-user-menu></c-dealer-user-menu>
            <div class="detail-header">
                <div class="detail-topbar">
                    <button type="button" class="back-btn" onclick={backToList}>
                        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                            <path d="M10 4L6 8l4 4" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Back to Contacts
                    </button>
                </div>

                <div class="detail-top">
                    <div class="detail-identity">
                        <div>
                            <div class="detail-meta">CONTACT · {selectedContact.accountName}</div>
                            <div class="detail-name">{selectedContact.Name}</div>
                            <div class="detail-company">
                                <span>{selectedContact.designationDisplay}</span>
                                <span class="divider-dot">·</span>
                                <span>Created {selectedContact.createdDate}</span>
                            </div>
                        </div>
                    </div>
                    <div class="detail-actions">
                        <button type="button" class="btn-edit" onclick={handleEditContact}>
                            Edit
                        </button>
                    </div>
                </div>
            </div>

            <div class="detail-layout">
                <div class="detail-columns">
                    <div class="detail-col detail-col-left">
                        <div class="info-card">
                            <div class="info-card-header">
                                <div class="info-card-icon">
                                    <lightning-icon icon-name="utility:contact" size="x-small"></lightning-icon>
                                </div>
                                <div class="info-card-title">Contact Information</div>
                            </div>
                            <div class="info-card-body">
                                <div class="info-row">
                                    <div class="info-row-label">Name</div>
                                    <div class="info-row-value">{selectedContact.Name}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Customer Name</div>
                                    <div class="info-row-value">{selectedContact.accountName}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Designation</div>
                                    <div class={selectedContact.designationClass}>{selectedContact.designationDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Status</div>
                                    <div class="info-row-value">
                                        <span class={selectedContact.statusBadgeClass}>{selectedContact.statusDisplay}</span>
                                    </div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Email Id</div>
                                    <div class={selectedContact.emailClass}>{selectedContact.emailDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Mobile No</div>
                                    <div class={selectedContact.mobileClass}>{selectedContact.mobileDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">DOB</div>
                                    <div class={selectedContact.dobClass}>{selectedContact.dobDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Anniversary</div>
                                    <div class={selectedContact.anniversaryClass}>{selectedContact.anniversaryDisplay}</div>
                                </div>
                            </div>
                        </div>

                        <div class="info-card">
                            <div class="info-card-header">
                                <div class="info-card-icon">
                                    <lightning-icon icon-name="utility:checkin" size="x-small"></lightning-icon>
                                </div>
                                <div class="info-card-title">Address Information</div>
                            </div>
                            <div class="info-card-body">
                                <div class="info-row">
                                    <div class="info-row-label">Street</div>
                                    <div class={selectedContact.streetClass}>{selectedContact.streetDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">City</div>
                                    <div class={selectedContact.cityClass}>{selectedContact.cityDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">State</div>
                                    <div class={selectedContact.stateClass}>{selectedContact.stateDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Postal Code</div>
                                    <div class={selectedContact.postalClass}>{selectedContact.postalDisplay}</div>
                                </div>
                                <div class="info-row">
                                    <div class="info-row-label">Country</div>
                                    <div class={selectedContact.countryClass}>{selectedContact.countryDisplay}</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-col detail-col-right">
                        <div class="info-card activity-card">
                            <div class="info-card-header">
                                <div class="info-card-icon">
                                    <lightning-icon icon-name="utility:clock" size="x-small"></lightning-icon>
                                </div>
                                <div class="info-card-title">Activity</div>
                            </div>

                            <div class="activity-actions">
                                <button type="button" class="activity-action-btn" onclick={handleNewTask}>
                                    <lightning-icon icon-name="utility:task" size="xx-small"></lightning-icon>
                                    New Task
                                </button>
                                <button type="button" class="activity-action-btn" onclick={handleNewEvent}>
                                    <lightning-icon icon-name="utility:event" size="xx-small"></lightning-icon>
                                    New Event
                                </button>
                            </div>

                            <div class="activity-subheader">Upcoming &amp; Overdue</div>

                            <div class="info-card-body activity-scroll">
                                <template if:true={hasUpcomingActivities}>
                                    <template for:each={upcomingActivities} for:item="item">
                                        <div key={item.id} class="activity-row">
                                            <div class="timeline">
                                                <div class="timeline-dot"></div>
                                            </div>
                                            <div class="activity-content">
                                                <div class="activity-text">{item.subject}</div>
                                                <div class="activity-date">{item.type} · {item.dueDate}</div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasUpcomingActivities}>
                                    <div class="activity-empty">
                                        No activities to show.
                                        <div class="activity-empty-sub">Get started by logging a task or event.</div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="info-card">
                            <div class="info-card-header">
                                <div class="info-card-icon">
                                    <lightning-icon icon-name="utility:note" size="x-small"></lightning-icon>
                                </div>
                                <div class="info-card-title">Notes</div>
                            </div>
                            <div class="info-card-body">
                                <div class="notes-box notes-scroll">
                                    <template if:true={hasNotes}>
                                        <template for:each={contactNotes} for:item="note">
                                            <div key={note.id} class="note-item">
                                                <div class="note-body">{note.body}</div>
                                                <div class="note-meta">
                                                    {note.createdDate} · {note.author}
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:false={hasNotes}>
                                        <div class="no-notes-text">No notes available</div>
                                    </template>
                                </div>

                                <div class="note-input-wrap">
                                    <input
                                        type="text"
                                        class="note-input"
                                        placeholder="Add a note or activity update..."
                                        value={noteText}
                                        oninput={handleNoteChange}/>
                                    <button type="button" class="add-note-btn" onclick={handleAddNote}>
                                        Add note
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="info-card">
                            <div class="info-card-header">
                                <div class="info-card-icon">
                                    <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                                </div>
                                <div class="info-card-title">Files</div>
                            </div>
                            <div class="info-card-body files-scroll">
                                <template if:true={hasFiles}>
                                    <template for:each={contactFiles} for:item="file">
                                        <div
                                            key={file.id}
                                            class="file-item"
                                            data-id={file.id}
                                            onclick={handleFilePreview}>
                                            <div class="file-icon">
                                                <lightning-icon icon-name="doctype:attachment" size="small"></lightning-icon>
                                            </div>
                                            <div>
                                                <div class="file-name">{file.title}</div>
                                                <div class="file-meta">{file.uploadedDate} · {file.size}</div>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasFiles}>
                                    <div class="activity-empty">No files yet.</div>
                                </template>
                            </div>
                            <div class="file-upload-wrap">
                                <label class="upload-btn" for="contactFileInput">
                                    <lightning-icon icon-name="utility:upload" size="xx-small"></lightning-icon>
                                    Upload Files
                                </label>
                                <input
                                    type="file"
                                    id="contactFileInput"
                                    class="file-input-hidden"
                                    multiple
                                    onchange={handleFileInputChange}/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template if:true={hasFilePreview}>
        <div class="preview-overlay" onclick={closeFilePreview}>
            <div class="preview-modal" onclick={stopPropagation}>
                <div class="preview-header">
                    <div class="preview-title">{previewFile.title}</div>
                    <button type="button" class="preview-close-btn" onclick={closeFilePreview}>✕</button>
                </div>
                <div class="preview-body">
                    <template if:true={previewFile.isImage}>
                        <img src={previewFile.url} alt={previewFile.title} class="preview-image"/>
                    </template>
                    <template if:true={previewFile.isPdf}>
                        <iframe src={previewFile.url} class="preview-iframe" title={previewFile.title}></iframe>
                    </template>
                    <template if:false={previewFile.isImage}>
                        <template if:false={previewFile.isPdf}>
                            <div class="preview-fallback">
                                Preview isn't available for this file type.
                                <a
                                    href={previewFile.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="preview-download-link">
                                    Download {previewFile.title}
                                </a>
                            </div>
                        </template>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <template if:true={showTaskModal}>
        <c-newtaskmodal
            related-contact-id={selectedContact.Id}
            related-contact-name={selectedContact.Name}
            partner-account-id={partnerAccountId}
            onclose={closeTaskModal}
            onsave={handleTaskSaved}
        ></c-newtaskmodal>
    </template>

    <template if:true={showEventModal}>
        <c-new-event-modal
            related-contact-id={selectedContact.Id}
            related-contact-name={selectedContact.Name}
            related-account-id={selectedContact.AccountId}
            related-account-name={selectedContact.accountName}
            partner-account-id={partnerAccountId}
            onclose={closeEventModal}
            onsave={handleEventSaved}
        ></c-new-event-modal>
    </template>

    <template if:true={showContactModal}>
        <div class="contact-modal-host" onclick={closeContactModal}>
            <div class="contact-modal-stop" onclick={stopContactModalBubble}>
                <c-new-contact-modal
                    partner-account-id={partnerAccountId}
                    contact-record={editingContact}
                    onclose={closeContactModal}
                    onsave={handleContactSaved}
                ></c-new-contact-modal>
            </div>
        </div>
    </template>
</template>
